# kitty as a dedicated herdr host. herdr's prefix is F12 (\x1b[24~); Cmd shortcuts
# send prefix+key so Ghostty-style muscle memory drives herdr.

shell /opt/homebrew/bin/herdr
macos_option_as_alt yes
# Closing the window only detaches; the herdr server keeps running.
confirm_os_window_close 0

clear_all_shortcuts yes

# herdr captures the mouse (ui.mouse_capture), so kitty sees clicks as "grabbed".
# Cmd+click opens the URL under the cursor in the default browser anyway; the
# press is discarded so herdr doesn't also get a click.
mouse_map cmd+left press   grabbed,ungrabbed discard_event
mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click link

# --- kitty/macOS essentials ---
map cmd+c       copy_to_clipboard
map cmd+v       paste_from_clipboard
map cmd+q       quit
map cmd+n       new_os_window
# Plain shell window outside herdr: an explicit launch command bypasses `shell`.
map cmd+shift+n launch --type=os-window /bin/zsh -lc "cd ~ && exec /bin/zsh -l"
map cmd+shift+w close_window
map cmd+h       hide_macos_app
map cmd+m       minimize_macos_window
map cmd+enter   toggle_fullscreen
map cmd+equal   change_font_size all +1.0
map cmd+minus   change_font_size all -1.0
map cmd+0       change_font_size all 0
map cmd+comma   edit_config_file
map cmd+shift+comma load_config_file

# --- herdr ---
map cmd+b             send_text all \x1b[24~
map cmd+t             send_text all \x1b[24~c
map cmd+d             send_text all \x1b[24~v
map cmd+shift+d       send_text all \x1b[24~-
map cmd+shift+enter   send_text all \x1b[24~z
map cmd+w             send_text all \x1b[24~x
map cmd+alt+w         send_text all \x1b[24~X

# tabs
map cmd+shift+[       send_text all \x1b[24~p
map cmd+shift+]       send_text all \x1b[24~n
map cmd+1             send_text all \x1b[24~1
map cmd+2             send_text all \x1b[24~2
map cmd+3             send_text all \x1b[24~3
map cmd+4             send_text all \x1b[24~4
map cmd+5             send_text all \x1b[24~5
map cmd+6             send_text all \x1b[24~6
map cmd+7             send_text all \x1b[24~7
map cmd+8             send_text all \x1b[24~8
map cmd+9             send_text all \x1b[24~9

# panes
map cmd+]             send_text all \x1b[24~\t
map cmd+[             send_text all \x1b[24~\x1b[Z
map cmd+alt+left      send_text all \x1b[24~h
map cmd+alt+down      send_text all \x1b[24~j
map cmd+alt+up        send_text all \x1b[24~k
map cmd+alt+right     send_text all \x1b[24~l

# workspaces / agents
map cmd+shift+up      send_text all \x1b[24~[
map cmd+shift+down    send_text all \x1b[24~]
map cmd+p             send_text all \x1b[24~w
map cmd+o             send_text all \x1b[24~o
map cmd+j             send_text all \x1b[24~a
map cmd+shift+j       send_text all \x1b[24~A
map cmd+e             send_text all \x1b[24~e

# --- line editing (Ghostty-style; Cmd never reaches the pty on its own) ---
map cmd+left       send_text all \x01
map cmd+right      send_text all \x05
map cmd+backspace  send_text all \x15
map cmd+k          send_text all \x0c
